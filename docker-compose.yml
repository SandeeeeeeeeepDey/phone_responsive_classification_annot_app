services:
  redis:
    image: redis:7-alpine
    container_name: deepannotate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Run Redis with Append Only File (AOF) and snapshotting enabled for maximum durability
    command: redis-server --appendonly yes --save 60 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    name: deepannotate-redis-data
